name: Sync sixtysevenlf/dsh-blender-plugin
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add sixtysevenlf/dsh-blender-plugin
        run: git remote add sixtysevenlf/dsh-blender-plugin https://github.com/sixtysevenlf/dsh-blender-plugin.git || true
      - name: Fetch sixtysevenlf/dsh-blender-plugin
        run: git fetch sixtysevenlf/dsh-blender-plugin
      - name: Merge sixtysevenlf/dsh-blender-plugin (ours strategy)
        run: |
          git merge sixtysevenlf/dsh-blender-plugin/HEAD --no-edit -X ours || git merge FETCH_HEAD --no-edit -X ours || true
          git diff --name-only --diff-filter=U | while IFS= read -r f; do
            case "$f" in
              .github/workflows/sync-sixtysevenlf/dsh-blender-plugin.yml) ;;
              .github/workflows/*) git rm -f "$f" ;;
              *) git checkout --ours -- "$f" || true ;;
            esac
          done
      - name: Keep only our workflow
        run: |
          mkdir -p .github/workflows
          find .github/workflows -type f ! -name "sync-sixtysevenlf/dsh-blender-plugin.yml" -delete
      - name: Commit and push
        run: |
          git add -f .github/workflows
          git commit -m "chore: preserve fork sync workflow" --allow-empty
          git push